[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "equinix-nexus"
url = "https://nexus.equinix.com/repository/pypi-mirror/simple/"
default = true
